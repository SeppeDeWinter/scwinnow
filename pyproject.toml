[project]
name = "scwinnow"
version = "0.1.0"
description = "Interactive filtering of AnnData objects with on-the-fly GPU re-embedding (UMAP / tSNE)"
readme = "README.md"
authors = [
    { name = "Seppe De Winter", email = "seppe.dewinter@hotmail.com" }
]
requires-python = ">=3.12,<3.15"
dependencies = [
    "anywidget>=0.11.0",
    "ipykernel>=7.4.0",
    "traitlets>=5.16.1",
    "websockets>=17.4",
    "anndata>=0.11",
    "fastapi>=0.162.4",
    "h5py>=3.12",
    "numpy>=2.0",
    "pandas>=2.2",
    "scanpy>=1.11",
    "tyro>=1.0.17",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
scwinnow = "scwinnow.cli:main"

[project.optional-dependencies]
gpu-cu13 = [
    "rapids-singlecell-cu13[rapids]>=0.18.1",
]
gpu-cu12 = [
    "rapids-singlecell-cu12[rapids]>=0.18.1",
]

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
conflicts = [[{ extra = "gpu-cu12" }, { extra = "gpu-cu13" }]]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: needs downloaded 10x data",
    "gpu: needs a CUDA GPU and rapids-singlecell",
]
addopts = "-m 'not slow and not gpu'"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "NPY"]

[tool.ty.environment]
python-version = "3.14"

[tool.ty.src]
include = ["src", "tests"]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.4",
    "ty>=0.0.100",
]
testdata = [
    "igraph>=1.0.0",
]
